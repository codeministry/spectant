<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28">
  <!-- The brand's living ring (shell-brand.ts, design.md § Wordmark): track, an 80 % arc and the violet dot in its gap.
       Colours are the light and dark values of the track, clos-ink and ques-ink tokens; it follows the system scheme. -->
  <style>
    .track { stroke: #8a8489; }
    .arc { stroke: #3f7701; }
    .dot { fill: #6f56bc; }
    @media (prefers-color-scheme: dark) {
      .track { stroke: #7f7d80; }
      .arc { stroke: #a6e22e; }
      .dot { fill: #ab9df2; }
    }
  </style>
  <g fill="none" stroke-width="3">
    <circle class="track" cx="14" cy="14" r="11" />
    <circle class="arc" cx="14" cy="14" r="11" pathLength="100" stroke-dasharray="80 20" stroke-linecap="round" transform="rotate(-24 14 14)" />
  </g>
  <circle class="dot" cx="19.5" cy="4.47" r="2.6" />
</svg>
