<div class="entry">
  <span class="entry-ring" aria-hidden="true">
    <ui-ring [value]="percent()" [size]="32" [stroke]="3" [label]="ringLabel()" />
    @if (running()) {
      <ui-agent-dot class="entry-pulse" />
    }
  </span>
  <span class="entry-id" aria-hidden="true">{{ spec().id }}</span>
  <a class="entry-link" [href]="href()" [attr.aria-label]="name()" (click)="onClick($event)">
    <span class="entry-title" [title]="spec().title">{{ spec().title }}</span>
  </a>
  <span class="entry-count" aria-hidden="true">{{ spec().claims.closed }}/{{ spec().claims.total }}</span>
  <ui-chip class="entry-stage" aria-hidden="true" [tone]="tone()" [dot]="true">{{ 'stages.' + spec().stage | transloco }}</ui-chip>
  @if (spec().nextCommand; as command) {
    <div class="entry-cmd">
      <ui-command-chip
        hint="toast"
        [command]="command"
        [context]="pathTail()"
        [copyLabel]="'orientation.copyCommand' | transloco: { command }"
        [copiedLabel]="'common.copied' | transloco: { command }"
        [manualHint]="'common.copyFallback' | transloco"
      />
    </div>
  }
</div>
