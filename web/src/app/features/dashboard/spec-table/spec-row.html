<span class="rid">
  <span class="rglyph">
    @if (glyphType(); as type) {
      <ui-type-glyph [type]="type" />
    }
  </span>
  <span class="rnum">{{ row().id }}</span>
</span>
<span class="rtitle">
  <span class="t" [title]="row().title" [uiClamp]="row().title" [uiClampLines]="1" [uiClampExpanded]="descriptionExpanded()"></span>
  @if (row().description; as description) {
    <span
      class="d"
      [id]="'desc-' + row().id"
      [title]="description"
      [uiClamp]="description"
      [uiClampExpanded]="descriptionExpanded()"
    ></span>
  }
</span>
<span class="rtrack">
  @if (density() === 'normal') {
    <span class="ragent">
      @if (row().agent) {
        <span class="agent-dot" role="img" [attr.aria-label]="agentLabel()" [title]="agentLabel()"></span>
      }
    </span>
  }
  <ui-priority class="rprio" [value]="row().priority" />
  <ui-stage-track size="mini" [labels]="stageLabels()" [current]="stageCurrent()" [ariaLabel]="stageAria()" />
  @if (row().phase; as phase) {
    <ui-chip class="phase" [tone]="phaseTone()" [dot]="true">{{ 'phases.' + phase | transloco }}</ui-chip>
  }
</span>
<span class="rmeter" role="img" [attr.aria-label]="'common.claimsClosed' | transloco: { closed: row().closed, total: row().total }">
  <ui-meter class="meter" [mini]="true" [value]="row().closed" [max]="row().total" aria-hidden="true" />
  <span class="frac" aria-hidden="true">{{ row().closed }}/{{ row().total }}</span>
</span>
