<!-- Spec 064 (T47, ISC-488): the spec row's ten named columns of `_row-grid.css`, each cell rendered even when empty. -->
<span class="rid" data-cell="id">
  <ui-icon name="lightbulb" [size]="16" />
</span>
<span class="rtitle" data-cell="title">
  <!-- The row link: the title, stretched over the whole row (`::after`), named "Idea <title>"; a first activation
       selects the story for the sidebar, one on the selected row opens the idea page (like a spec row, ISC-484). -->
  <a
    class="link"
    data-idea-title
    [attr.href]="href()"
    [attr.data-ref]="ref()"
    [attr.data-selected]="look()"
    [attr.aria-expanded]="look() !== null"
    [attr.aria-label]="'specs.ideaRow.name' | transloco: { title: title() }"
    (click)="activate($event)"
    >{{ title() }}</a
  >
  @if (where(); as where) {
    <span class="where" data-idea-where>{{ where }}</span>
  }
</span>
<span data-cell="more"></span>
<span data-cell="mark"></span>
<span data-cell="agent"></span>
<span class="rprio" data-cell="prio">
  <ui-priority [value]="priority()" />
</span>
<span data-cell="track"></span>
<!-- The state where a spec row has its phase chip, without its command (ISC-482); meter and star stay empty. -->
<span class="rphase" data-cell="phase">
  @if (state(); as state) {
    <ui-item-state class="rstate" [info]="state" [ws]="ws()" noActor />
  }
</span>
<span data-cell="meter"></span>
<span data-cell="star"></span>
