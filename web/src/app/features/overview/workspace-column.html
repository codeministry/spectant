@let c = column();
@let id = identity();
<ui-card class="tile-frame" [padding]="0" edge [glow]="false" [style.--edge]="id.edge">
  <div class="tile-grid">
    <app-ws-identity [name]="c.name" [slug]="c.slug" [pathTail]="c.pathTail" [logo]="c.logo">
      <span class="meta type-meta" data-updated>{{ 'header.live.updated' | transloco: { time: ago() } }}</span>
    </app-ws-identity>

    <div data-tile-block="preview">
      <a class="preview-link" [routerLink]="href()" [attr.aria-label]="'identity.open' | transloco: { workspace: c.name }">
        <ui-ws-cover
          data-ws-cover
          shape="tile"
          [name]="c.name"
          [image]="c.screenshot ?? id.image"
          [alt]="'identity.screenshot' | transloco: { workspace: c.name }"
          [logo]="c.logo"
          [monogram]="id.monogram"
        />
      </a>
    </div>

    <div data-tile-block="list">
      <app-tile-list [tile]="c.tile" [workspace]="c.slug" [name]="c.name" />
    </div>

    <div data-tile-block="kpi">
      <app-tile-kpis [kpis]="c.kpis" />
    </div>
  </div>
</ui-card>
