<div class="ws-head">
  @if (link()) {
    <!-- The badge is a second, mouse-only way in; the name is the link the keyboard and the screen reader meet. -->
    <a class="head-badge" [routerLink]="href()" tabindex="-1" aria-hidden="true">
      <ui-ws-badge data-ws-badge size="lg" [name]="name()" [logo]="logo()" />
    </a>
  } @else {
    <span class="head-badge">
      <ui-ws-badge data-ws-badge size="lg" [name]="name()" [logo]="logo()" />
    </span>
  }
  <div class="line line-1" data-head-line="1">
    @if (link()) {
      <a class="name" [routerLink]="href()"><h2>{{ name() }}</h2></a>
    } @else {
      <span class="name"><h2>{{ name() }}</h2></span>
    }
  </div>
  <div class="line line-2" data-head-line="2">
    <span class="path">{{ pathTail() }}</span>
    <span class="sep" aria-hidden="true"></span>
    <span class="updated"><ng-content /></span>
  </div>
</div>
