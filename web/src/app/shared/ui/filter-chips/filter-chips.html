
    <div class="row" role="group" [attr.aria-label]="label() ?? null">
      @for (option of options(); track option.key) {
        <button
          type="button"
          class="btn btn-sm btn-ghost chip"
          [attr.aria-pressed]="pressed(option.key)"
          [attr.aria-label]="option.name ?? null"
          [attr.title]="multiple() ? option.label : null"
          (click)="press(option.key)"
        >
          @if (option.tone; as tone) {
            <span class="dot" aria-hidden="true" [style.background]="color(tone)"></span>
          }
          <!-- The multiple mode wraps the label so it can end in an ellipsis; the single mode keeps its bare text. -->
          @if (multiple()) {
            <span class="text">{{ option.label }}</span>
          } @else {
            {{ option.label }}
          }
          @if (option.count !== undefined) {
            <span class="count">{{ option.count }}</span>
          }
        </button>
      }
    </div>
