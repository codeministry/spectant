<header role="banner" class="shell-header" [class.on-spec]="specPage()" [class.scrolled]="scrolled()">
  <!-- The brand rail's bordered field (prototype `.brand-rail`): behind brand and rail-selects at wide, the logo below. -->
  <span class="rail-field" aria-hidden="true"></span>

  <app-shell-brand class="brand" />
  <app-shell-nav #nav class="nav" />

  <button
    type="button"
    class="palette tool"
    data-control="palette"
    aria-haspopup="dialog"
    aria-keyshortcuts="Meta+K Control+K /"
    [attr.aria-label]="'shell.palette.trigger' | transloco"
    [attr.aria-expanded]="keyboard.paletteOpen()"
    (click)="keyboard.openPalette()"
  >
    <ui-icon name="search" />
    <span class="palette-text" aria-hidden="true">{{ 'shell.palette.trigger' | transloco }}</span>
    <ui-kbd class="palette-key" aria-hidden="true">{{ 'shell.palette.key' | transloco }}</ui-kbd>
  </button>

  <app-shell-live class="live tool" [link]="liveLink()" />

  @if (wide()) {
  <button
    ui-icon-button
    class="zen"
    data-control="zen"
    icon="scan"
    [label]="'shell.zen.toggle' | transloco"
    [attr.aria-pressed]="state.zen()"
    (click)="state.toggleZen()"
  ></button>

  <!-- The assistant dot (prototype `assistant-toggle`): only the trigger's place and look; T53 builds the assistant. -->
  <button
    type="button"
    class="assistant tool"
    data-tool="assistant"
    aria-pressed="false"
    aria-disabled="true"
    [attr.aria-label]="'shell.assistant.trigger' | transloco"
    [attr.title]="'shell.assistant.soon' | transloco"
  >
    <svg class="mascot" viewBox="0 0 48 48" aria-hidden="true" focusable="false" data-icon-exempt>
      <!-- The mascot (prototype `assistant.js` `mascot("idle", 20)`), not a lucide icon (data-icon-exempt, ISC-18.2): -->
      <!-- the ring lime to cyan, top left to bottom right, and the violet dot with eyes and mouth in its gap. -->
      <g class="m-rings">
      <circle class="m-ring" cx="24" cy="24" r="15" pathLength="8" stroke-dashoffset="0" style="--m-mix: 4%" />
      <circle class="m-ring" cx="24" cy="24" r="15" pathLength="8" stroke-dashoffset="-1" style="--m-mix: 4%" />
      <circle class="m-ring" cx="24" cy="24" r="15" pathLength="8" stroke-dashoffset="-2" style="--m-mix: 31%" />
      <circle class="m-ring" cx="24" cy="24" r="15" pathLength="8" stroke-dashoffset="-3" style="--m-mix: 69%" />
      <circle class="m-ring" cx="24" cy="24" r="15" pathLength="8" stroke-dashoffset="-4" style="--m-mix: 96%" />
      <circle class="m-ring" cx="24" cy="24" r="15" pathLength="8" stroke-dashoffset="-5" style="--m-mix: 96%" />
      <circle class="m-ring" cx="24" cy="24" r="15" pathLength="8" stroke-dashoffset="-6" style="--m-mix: 69%" />
      <circle class="m-ring" cx="24" cy="24" r="15" pathLength="8" stroke-dashoffset="-7" style="--m-mix: 31%" />
      </g>
      <circle class="m-dot" cx="31.5" cy="11" r="7.5" />
      <circle class="m-eye" cx="29.3" cy="10" r="1.15" />
      <circle class="m-eye" cx="33.7" cy="10" r="1.15" />
      <path class="m-mouth" d="M29.5 13.4c.9 1.2 3.1 1.2 4 0" />
    </svg>
  </button>

  <button
    ui-icon-button
    class="settings tool"
    data-control="settings"
    icon="settings"
    aria-haspopup="dialog"
    [label]="'shell.settings' | transloco"
    [attr.title]="'shell.settings' | transloco"
    [attr.aria-expanded]="nav.expanded().settings"
    (pointerdown)="nav.press('settings')"
    (click)="nav.toggle($event, 'settings')"
  ></button>

  <button
    ui-icon-button
    class="help tool"
    data-tool="help"
    icon="circle-help"
    aria-haspopup="dialog"
    [label]="'shell.help' | transloco"
    (click)="keyboard.sheetOpen.set(true)"
  ></button>
  } @else {
  <!-- Below 1120 px (spec 024 T76): area, zen, assistant, settings and help live in the overflow menu. -->
  <button
    ui-icon-button
    class="more"
    data-tool="more"
    icon="ellipsis"
    aria-haspopup="dialog"
    [label]="'shell.more' | transloco"
    [attr.title]="'shell.more' | transloco"
    [attr.aria-expanded]="nav.expanded().more"
    (pointerdown)="nav.press('more')"
    (click)="nav.toggle($event, 'more')"
  ></button>
  }
</header>
