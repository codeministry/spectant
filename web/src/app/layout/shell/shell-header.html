<header role="banner" class="shell-header">
  <!-- The left group's one bordered rail field (medium, wide: brand · pickers · area), drawn behind them. -->
  <span class="rail-field" aria-hidden="true"></span>

  <app-shell-brand class="brand" />
  <app-shell-nav />

  <app-tab-bar-slot class="tabs" placement="header" />

  <button
    type="button"
    class="palette tool"
    data-control="palette"
    aria-disabled="true"
    aria-describedby="shell-palette-pending"
    [attr.aria-label]="'shell.palette.trigger' | transloco"
    [attr.title]="'shell.palette.pending' | transloco"
  >
    <ui-icon name="search" />
    <span class="palette-text" aria-hidden="true">{{ 'shell.palette.trigger' | transloco }}</span>
    <ui-kbd class="palette-key" aria-hidden="true">{{ 'shell.palette.key' | transloco }}</ui-kbd>
  </button>
  <span id="shell-palette-pending" class="visually-hidden">{{ 'shell.palette.pending' | transloco }}</span>

  <app-shell-live class="live tool" [link]="liveLink()" />

  <button
    ui-icon-button
    class="zen"
    data-control="zen"
    [icon]="state.zen() ? 'minimize-2' : 'maximize-2'"
    [label]="'shell.zen' | transloco"
    [attr.aria-pressed]="state.zen()"
    (click)="state.toggleZen()"
  ></button>

  <a
    ui-button
    variant="ghost"
    class="settings tool btn-square"
    data-control="settings"
    routerLink="/settings"
    routerLinkActive
    ariaCurrentWhenActive="page"
    [attr.aria-label]="'shell.settings' | transloco"
    [attr.title]="'shell.settings' | transloco"
  >
    <ui-icon name="settings" [size]="16" />
  </a>
</header>
