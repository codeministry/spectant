<app-shell-header />
<div class="shell-body">
  <main id="main" class="shell-main">
    <router-outlet />
  </main>
  @if (showRail()) {
    <aside
      class="shell-rail"
      [attr.data-rail-strip]="railStrip() ? '' : null"
      [attr.aria-label]="'shell.rail.label' | transloco"
    >
      <!-- Spec 067: the docked detail sidebar holds the rail open and closes with its own button, so no fold toggle. -->
      @if (state.tier() === 'wide' && !detailDocked()) {
        <app-rail-toggle class="rail-toggle" [collapsed]="railStrip()" />
      }
      @if (!railStrip()) {
        <app-rail-slot />
      }
    </aside>
  }
</div>
<!-- Spec 026 (T13-T15): the detail sidebar wherever it does not dock: floating panel, overlay or bottom sheet. -->
<app-detail-sidebar slot="float" />
@if (state.zen() && showRail()) {
  <app-zen-footer />
}
