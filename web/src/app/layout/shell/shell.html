<app-shell-header />
<div class="shell-body">
  <main id="main" class="shell-main">
    <router-outlet />
  </main>
  @if (showRail()) {
    <aside
      class="shell-rail"
      [attr.data-rail-strip]="state.railStrip() ? '' : null"
      [attr.aria-label]="'shell.rail.label' | transloco"
    >
      @if (state.tier() === 'wide') {
        <app-rail-toggle class="rail-toggle" [collapsed]="state.railStrip()" />
      }
      @if (!state.railStrip()) {
        <app-rail-slot />
      }
    </aside>
  }
</div>
@if (state.zen() && showRail()) {
  <app-zen-footer />
}
